[project]
name = "tenure"
version = "0.1.0"
description = "Decides which agent-written pull requests may merge without a human, and takes that right away when a merge goes wrong."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "httpx>=0.27", "pyjwt[crypto]>=2.8", "starlette>=0.37", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
sandbox = ["contree-sdk>=0.3.6"]   # Nebius Token Factory Sandboxes, for the verification agent

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF"]
ignore = ["S101"]   # assert is how pytest works

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603", "S607"]   # tests drive git on fixture repos they create
"tenure/dashboard.py" = ["E501"]   # an HTML template reads better unwrapped

[tool.setuptools]
# Named explicitly: with deploy/ beside tenure/, auto-discovery can't tell which
# folder is the package and refuses to build.
packages = ["tenure"]
