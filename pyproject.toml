[project]
name = "tenure"
version = "0.1.0"
description = "Decides which agent-written pull requests may merge without a human, and takes that right away when a merge goes wrong."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF"]
ignore = ["S101"]   # assert is how pytest works

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
